<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- background: deep indigo with a warm sunrise glow -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b6e"/>
      <stop offset=".55" stop-color="#4a1fa3"/>
      <stop offset="1" stop-color="#1b0f45"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".86" r=".62">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ff2f86" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff2f86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".12" cy=".08" r=".55">
      <stop offset="0" stop-color="#4fd1ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset=".35" stop-color="#ff8a3d"/>
      <stop offset=".75" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e1f5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17113d"/>
      <stop offset="1" stop-color="#0d0a26"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb04a"/><stop offset="1" stop-color="#ff6a2b"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fa2"/><stop offset="1" stop-color="#ff2a6d"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee7ff"/><stop offset="1" stop-color="#2f8bff"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b892ff"/><stop offset="1" stop-color="#7a4dff"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0a0520" flood-opacity=".55"/>
    </filter>
    <filter id="tileGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq"><rect x="0" y="0" width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#glow2)"/>
    <!-- faint blueprint dots -->
    <g fill="#ffffff" fill-opacity=".07">
      <circle cx="128" cy="160" r="5"/><circle cx="208" cy="160" r="5"/><circle cx="128" cy="240" r="5"/>
      <circle cx="864" cy="192" r="5"/><circle cx="896" cy="272" r="5"/><circle cx="160" cy="864" r="5"/><circle cx="240" cy="896" r="5"/>
    </g>
    <!-- "swift" orbit swoosh behind the phone -->
    <path d="M96 760 C 300 980, 820 860, 930 330" fill="none" stroke="url(#swoosh)" stroke-width="54" stroke-linecap="round" opacity=".95"/>
    <path d="M150 820 C 360 990, 760 900, 880 470" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
    <rect width="1024" height="512" fill="url(#shine)"/>
  </g>

  <!-- the phone -->
  <g filter="url(#drop)">
    <rect x="322" y="168" width="380" height="688" rx="88" fill="url(#body)"/>
    <rect x="346" y="192" width="332" height="640" rx="66" fill="url(#screen)"/>
    <rect x="462" y="216" width="100" height="30" rx="15" fill="#05030f"/>
    <!-- four app tiles = an app grid and a window -->
    <g filter="url(#tileGlow)">
      <rect x="388" y="330" width="116" height="116" rx="30" fill="url(#t1)"/>
      <rect x="520" y="330" width="116" height="116" rx="30" fill="url(#t2)"/>
      <rect x="388" y="462" width="116" height="116" rx="30" fill="url(#t3)"/>
      <rect x="520" y="462" width="116" height="116" rx="30" fill="url(#t4)"/>
    </g>
    <!-- code chevrons -->
    <path d="M440 668 l-38 34 38 34" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M584 668 l38 34 -38 34" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M530 660 l-36 84" fill="none" stroke="#ff8a3d" stroke-width="20" stroke-linecap="round"/>
    <rect x="456" y="790" width="112" height="10" rx="5" fill="#ffffff" fill-opacity=".55"/>
  </g>
</svg>
