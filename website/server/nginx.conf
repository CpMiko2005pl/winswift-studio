# winswift.tacticalops.fun — static site (container winswift-web, host network, behind the Cloudflare tunnel "winswift")
server {
    listen 127.0.0.1:8793;
    server_name winswift.tacticalops.fun;
    root /srv/www/site;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml image/x-icon text/plain application/xml;

    error_page 404 /404.html;

    # visit counter: same counter as tacticalops.fun (pages are recorded as /winswift/…)
    location = /odwiedziny.php {
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host tacticalops.fun;
        proxy_http_version 1.1;
    }

    # file names of css/js carry a content hash
    location ~* ^/assets/.+\.(?:css|js)$ {
        include /etc/nginx/winswift-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(?:webp|png|jpg|jpeg|svg|ico|woff2)$ {
        include /etc/nginx/winswift-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location = /site.webmanifest {
        include /etc/nginx/winswift-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ~* \.(?:xml|txt)$ {
        include /etc/nginx/winswift-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/winswift-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        try_files $uri $uri/ =404;
    }
}
